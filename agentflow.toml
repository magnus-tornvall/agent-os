# agentflow, driving this repository. Prompt paths resolve against this file.
# Every key but `prompt` is optional and falls back to a value the binary carries.

copyToWorktree = []

# Which providers a run may read its issue from, and what a bare number means.
# `agentflow 42` is `gh:42` here; `agentflow ado:42` is refused, because no
# [issues.providers.ado] table declares it.
[issues]
default = "gh"

[issues.providers.gh]

[phases.implement]
prompt = "workflows/prompts/implement.md"
maxIterations = 1

[phases.review]
prompt = "workflows/prompts/review.md"
maxIterations = 1

[phases.fix]
prompt = "workflows/prompts/fix.md"
maxIterations = 1

[phases.conform]
prompt = "workflows/prompts/conform.md"
