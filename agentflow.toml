# agentflow, driving this repository. Prompt paths resolve against this file.
# Every key but `prompt` is optional and falls back to a value the binary carries.

copyToWorktree = []

[phases.implement]
prompt = "workflows/prompts/implement.md"
maxIterations = 1

[phases.review]
prompt = "workflows/prompts/review.md"
maxIterations = 1

[phases.fix]
prompt = "workflows/prompts/fix.md"
maxIterations = 1

[phases.conform]
prompt = "workflows/prompts/conform.md"
